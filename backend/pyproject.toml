[project]
name = "feira-viva-api"
version = "1.0.0"
requires-python = ">=3.12"
# mantenha em sincronia com requirements.txt (usado no CI e no Docker)
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic[email]==2.10.4",
    "pydantic-settings==2.7.1",
    "psycopg[binary]==3.2.3",
    "psycopg-pool==3.2.4",
    "bcrypt==4.2.1",
    "PyJWT==2.10.1",
    "python-multipart==0.0.20",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends() em parâmetros é o padrão do FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "app.main:app"
